    - "Hello, I'm Sarah. I support multidimensional growth through soul-centred guidance, self-connection practices, and energy work. I am fluent in Mandarin Chinese and English, offering sessions in both languages to clients from diverse cultural backgrounds."
    - "Before stepping into spiritual service, I spent nearly two decades in the high-tech industry as a Human Resources Partner and Leader. Collaborating with executives, leaders, and teams across cultures gave me a grounded understanding of human potential — and of how families, relationships, cultures, and organisations influence the choices we make."
    - "As life unfolded, the call toward who I really am grew ever louder — to support people in growing multi-dimensionally. Led by my Higher Self and Guides, I walked that journey and became a Certified Akashic Records Guide in 2026. Along the way, I have also become a Vipassana meditator, a Level II Usui Reiki practitioner, and an energy practitioner working with my Phoenix Guide."
    - "At the heart of my work is a simple belief: wisdom isn't given — it is revealed from within. I hold a clear, compassionate space in which you can explore what is ready to unfold, while your free will and personal sovereignty remain at the centre."
